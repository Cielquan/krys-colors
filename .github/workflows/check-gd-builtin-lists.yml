name: Check GDScript grammar's builtin lists

on: # yamllint disable-line rule:truthy
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: ^11.21.0
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate script
        id: validate
        run: |
          set +e
          output="$(pnpm validate:gd 2>&1)"
          exit_code=$?
          {
            echo "output<<VALIDATE_EOF"
            echo "$output"
            echo "VALIDATE_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Create issue on failure
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          VALIDATE_OUTPUT: ${{ steps.validate.outputs.output }}
        with:
          script: |
            const output = process.env.VALIDATE_OUTPUT || "(no output captured)";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "GDScript grammar file missing values",
              body: "```\n" + output + "\n```"
            });
