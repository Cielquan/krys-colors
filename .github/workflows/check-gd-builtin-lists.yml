name: Check GDScript grammar's builtin lists

on: # yamllint disable-line rule:truthy
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: ^11.21.0
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate script
        id: validate
        run: |
          set +e
          output="$(pnpm validate:gd 2>&1)"
          exit_code=$?
          {
            echo "output<<VALIDATE_EOF"
            echo "$output"
            echo "VALIDATE_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Report failure
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          VALIDATE_OUTPUT: ${{ steps.validate.outputs.output }}
        with:
          script: |
            const title = "GDScript grammar file missing values";
            const output = process.env.VALIDATE_OUTPUT || "(no output captured)";
            const body = "```\n" + output + "\n```";

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
              }
            );
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
