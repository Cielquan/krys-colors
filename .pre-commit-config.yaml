---
minimum_pre_commit_version: "2.16"
default_stages: [pre-commit]
default_language_version:
  python: python3.12

ci:
  skip: []

repos:
  # ----------------------------------------------
  # Meta hooks
  # ----------------------------------------------

  - repo: meta
    hooks:
      - id: identity
        stages: [manual]
      - id: check-hooks-apply
        stages: [manual]
      - id: check-useless-excludes
        stages: [manual]

  # ####################################################################################
  #
  #       Essential
  #
  # ####################################################################################

  - repo: https://github.com/Cielquan/pre-commit-hooks
    rev: 3d8c90d7c4bce7f39d145e932927e80fcff6be20 # frozen: v1.0.2
    hooks:
      - id: remove-comments-from-jsonc
        # files: '.*\.jsonc'
        exclude: code_examples

  # ####################################################################################
  #
  #       FORMATTING
  #
  # ####################################################################################

  # ----------------------------------------------
  # JavaScript / TypeScript
  # ----------------------------------------------

  # eslint - JS linter (run as formatter - also run as linter afterwards (below))
  - repo: https://github.com/eslint/eslint
    # Config file: eslint.config.ts
    #     https://eslint.org/docs/user-guide/configuring/configuration-files
    # Ignore file: .eslintignore [file ignore pattern]
    rev: a7d5fe64f402eefdc2bbb73992d3a4ac49f426a5 # frozen: v9.39.3
    hooks:
      - id: eslint
        name: eslint (fix)
        # TODO:#i# lock node version because of bug in node v23 - wait for release
        # https://github.com/nodejs/node/pull/55414
        language_version: 22.18.0
        stages: ["pre-commit"]
        # *.js, *.ts, *.cjs, *.cts, *.mjs, *.mts, *.jsx, *.tsx
        files: '(\.[cm]?[jt]s$)|(\.[jt]sx$)'
        types: [file]
        exclude: code_examples
        args: ["--fix", "--max-warnings=0"]
        require_serial: true
        additional_dependencies:
          - eslint@9.39.3 # NOTE: version overwrites rev version - keep in sync
          - "@eslint/compat@1.3.2"
          - "@eslint/eslintrc@3.3.4"
          - "@eslint/js@9.39.3"
          - "@stylistic/eslint-plugin@5.2.3"
          - "@typescript-eslint/parser@8.39.1"
          - confusing-browser-globals@1.0.11
          - eslint-import-resolver-node@0.3.9
          - eslint-import-resolver-typescript@4.4.4
          - eslint-plugin-import-x@4.16.1
          - eslint-plugin-n@17.21.3
          - eslint-plugin-prettier@5.5.4
          - globals@16.3.0
          - jiti@2.5.1
          - prettier@3.6.2
          - typescript@~5.8.3
          - typescript-eslint@8.39.1

  # ----------------------------------------------
  # General (code unspecific)
  # ----------------------------------------------

  # code unspecific out-of-the-box hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]

  # ----------------------------------------------
  # JS / TS / HTML / CSS / MD / JSON / YAML
  # ----------------------------------------------

  # prettier - JS formater
  - repo: https://github.com/pre-commit/mirrors-prettier
    # https://github.com/prettier/prettier
    # Config file: .prettierrc (JSON, YAML)
    # Ignore file: .prettierignore (file ignore pattern)
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea # frozen: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@^3.6.2 # NOTE: version overwrites rev version - keep in sync
        args: ["--ignore-path", ".gitignore"]
        files: \.(html|css|json|yaml|md)$
        exclude: code_examples

  # ####################################################################################
  #
  #       LINTING
  #
  # ####################################################################################

  # ----------------------------------------------
  # General (code unspecific)
  # ----------------------------------------------

  - repo: local
    hooks:
      # Find TODO:|FIXME:|BUG: comments in all files
      # Inline skip: `#i#` directly after the colon after the tag-word
      - id: find-todos
        name: "Find TODO:|FIXME:|BUG: comments"
        description: "Check for TODO:|FIXME:|BUG: comments in all files"
        language: pygrep
        entry: '(^|//!?|#|<!--|;|/\*(\*|!)?|\.\.)\s*(TODO:|FIXME:|BUG:)(?!#i#)'
        exclude: TODO

  # code unspecific out-of-the-box hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
        exclude: 'code_examples|^.*\.rs$'
      - id: detect-private-key

  # ----------------------------------------------
  # JSON / TOML / YAML
  # ----------------------------------------------

  # JSON specific out-of-the-box hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: check-json
        exclude: code_examples
      - id: check-toml
        exclude: code_examples
      - id: check-yaml
        exclude: code_examples

  # yamllint - yaml linter
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6 # frozen: v1.35.1
    hooks:
      # Config file: .yamllint (yaml) [--config-file]
      # Inline skip: `# yamllint disable-line[ rule:<RULE>]`
      # Block skip: `# yamllint disable[ rule:<RULE>]`
      # Block skip end: `# yamllint enable`
      - id: yamllint
        exclude: code_examples|pnpm-lock.yaml
