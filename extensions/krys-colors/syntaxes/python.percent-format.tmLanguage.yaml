---
injectionSelector: L:string.quoted

scopeName: source.fix.percent-format.python

patterns:
  - include: "#percent-format-override"

repository:
  percent-format-override:
    name: meta.format.percent.python
    match: |-
      (?x)
      (%%)
      | (?:
          (%)
          (\([A-Za-z0-9_ \t]*\))?
          (
            ([-+#0 ]*)
            ([0-9]+|\*)? (\.([0-9]+|\*))?
            ([Lhl])?
            ([EFGXabcdefgiorsux])
          )
        )
      # regex-end
    captures:
      "1":
        name: constant.character.escape.python
      "2":
        name: constant.character.format.placeholder.other.python
      "3":
        name: constant.character.format.placeholder.other.python
      "4":
        name: storage.type.format.python
