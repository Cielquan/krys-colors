---
injectionSelector: L:source.rust -string

scopeName: source.fix.rust

patterns:
  - include: "#inner-doc-comment"
  - include: "#async"
  - include: "#pub"
  - include: "#unsafe"

repository:
  async:
    match: |-
      \b(async)\b
    captures:
      "1":
        name: storage.modifier.async.rust

  inner-doc-comment:
    name: comment.line.documentation.rust
    match: |-
      ^\s*//!.*

  pub:
    match: |-
      \b(pub)\b
    captures:
      "1":
        name: storage.modifier.visibility.rust

  unsafe:
    match: |-
      (?<!\[)\b(unsafe)\b
    captures:
      "1":
        name: storage.modifier.unsafe.rust