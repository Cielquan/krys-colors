---
name: GDScript

scopeName: source.gdscript

fileTypes:
  - gd

patterns:
  - include: "#comment-documentation-full-line"
  - include: "#comment-region-full-line"
  - include: "#comment-full-line"
  - include: "#class-declaration"
  - include: "#class-name-declaration"
  - include: "#extends-declaration"
  - include: "#line-continuation"
  - include: "#comment-documentation-inline"
  - include: "#comment-inline"

repository:
  comment-full-line:
    name: comment.line.number-sign.gdscript
    begin: |-
      (?x)
      ^[ \t]*([#])
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.number-sign.gdscript
    end: |-
      (?x)
      $
      # regex-end

  comment-inline:
    name: comment.line.number-sign.gdscript
    begin: |-
      (?x)
      [ \t]*([#])
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.number-sign.gdscript
    end: |-
      (?x)
      $
      # regex-end

  comment-documentation-full-line:
    name: "comment.block.documentation.gdscript comment.line.documentation.gdscript"
    begin: |-
      (?x)
      ^[ \t]*([#]{2})
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.documentation.gdscript
    end: |-
      (?x)
      $
      # regex-end

  comment-documentation-inline:
    name: "comment.block.documentation.gdscript comment.line.documentation.gdscript"
    begin: |-
      (?x)
      [ \t]*([#]{2})
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.documentation.gdscript
    end: |-
      (?x)
      $
      # regex-end

  comment-region-full-line:
    patterns:
      - name: comment.block.region.gdscript
        begin: |-
          (?x)
          ^[ \t]*([#])(region)[ \t](.*)
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.number-sign.gdscript
          "2":
            name: keyword.declaration.region.gdscript
          "3":
            name: entity.name.section.gdscript
        end: |-
          (?x)
          $
          # regex-end
      - name: comment.block.region.gdscript
        begin: |-
          (?x)
          ^[ \t]*([#])(endregion)
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.number-sign.gdscript
          "2":
            name: keyword.declaration.region.gdscript
        end: |-
          (?x)
          $
          # regex-end

  class-name-declaration:
    name: meta.class.declaration.gdscript
    match: |-
      (?x)
      ^
      [ \t]*
      (class_name)
      [ \t]+
      ([A-Za-z_][A-Za-z0-9_]*)
      # regex-end
    captures:
      "1":
        name: storage.type.class.gdscript
      "2":
        name: entity.name.type.class.gdscript

  class-declaration:
    name: meta.class.declaration.gdscript
    contentName: entity.other.inherited-class.gdscript
    begin: |-
      (?x)
      ^
      [ \t]*
      (class)
      [ \t]+
      ([A-Za-z_][A-Za-z0-9_]*)
      (?:
        [ \t]+
        (extends)
        [ \t]+
      )?
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.class.gdscript
      "2":
        name: entity.name.type.class.gdscript
      "3":
        name: keyword.control.inheritance.gdscript
    end: |-
      (?x)
      (:)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.section.class.begin.gdscript
    patterns:
      - include: "#_string-quoted-multi-line"
      - include: "#_string-quoted-single-line"
      - include: "#_string-raw-quoted-multi-line"
      - include: "#_string-raw-quoted-single-line"
      - match: |-
          (?x)
          (\.)?
          ([A-Za-z_][A-Za-z0-9_]*)
          # regex-end

  extends-declaration:
    name: meta.class.declaration.gdscript
    contentName: entity.other.inherited-class.gdscript
    begin: |-
      (?x)
      [ \t]*
      (extends)
      [ \t]+
      # regex-end
    beginCaptures:
      "1":
        name: keyword.control.inheritance.gdscript
    end: |-
      (?x)
      $
      # regex-end
    patterns:
      - include: "#_string-quoted-multi-line"
      - include: "#_string-quoted-single-line"
      - include: "#_string-raw-quoted-multi-line"
      - include: "#_string-raw-quoted-single-line"
      - match: |-
          (?x)
          (\.)?
          ([A-Za-z_][A-Za-z0-9_]*)
          # regex-end

  line-continuation:
    patterns:
      - match: |-
          (?x)
          (\\)([ \t]*\S.*)?$\n?
          # regex-end
        captures:
          "1":
            name: punctuation.separator.continuation.line.gdscript
          "2":
            name: invalid.illegal.line.continuation.gdscript

  _language-constants:
    name: constant.language.gdscript
    match: |-
      (?x)
      \b(?:(true)|(false)|(null)|(PI)|(TAU)|(INF)|(NAN))\b
      # regex-end
    captures:
      "1":
        name: constant.language.bool.true.gdscript
      "2":
        name: constant.language.bool.false.gdscript
      "3":
        name: constant.language.null.gdscript
      "4":
        name: constant.language.number.pi.gdscript
      "5":
        name: constant.language.number.tau.gdscript
      "6":
        name: constant.language.number.inf.gdscript
      "7":
        name: constant.language.number.nan.gdscript

  _numbers:
    patterns:
      - name: constant.numeric.hex.gdscript
        match: |-
          (?x)
          (0[Xx])[A-Fa-f0-9][A-Fa-f0-9_]*
          # regex-end
        captures:
          "1":
            name: storage.type.number.gdscript

      - name: constant.numeric.bin.gdscript
        match: |-
          (?x)
          (0[Bb])[0-1][0-1_]*
          # regex-end
        captures:
          "1":
            name: storage.type.number.gdscript

      - name: constant.numeric.float.gdscript
        match: |-
          (?x)
          (
            ([0-9][0-9_]*)\.([0-9][0-9_]*)?
            | ([0-9][0-9_]*)?\.([0-9][0-9_]*)
          )
          ([Ee][+-]?([0-9][0-9_]*))?
          # regex-end

      - name: constant.numeric.dec.gdscript
        match: |-
          (?x)
          [0-1][0-1_]*
          # regex-end
        captures:
          "1":
            name: storage.type.number.gdscript

      - comment: fallback for malformed numbers
        name: invalid.illegal.name.gdscript
        match: |-
          (?x)
          \b[0-9]+[A-Za-z0-9_]+
          # regex-end

  _reserved-keywords:
    name: invalid.illegal.word.gdscript
    match: |-
      (?x)
      \b(namespace|trait|yield)\b
      # regex-end

  _strings:
    patterns:
      - include: "#_string-quoted-multi-line"
      - include: "#_string-quoted-single-line"
      - include: "#_string-raw-quoted-multi-line"
      - include: "#_string-raw-quoted-single-line"

      - include: "#_string-name-quoted-multi-line"
      - include: "#_string-name-quoted-single-line"

      - include: "#_string-node-path-quoted-multi-line"
      - include: "#_string-node-path-quoted-single-line"

  _string-quoted-multi-line:
    name: string.quoted.multi.gdscript
    begin: |-
      (?x)
      ('''|""")
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.string.begin.multi.gdscript
    end: |-
      (?x)
      (\1)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-quoted-single-line:
    name: string.quoted.single.gdscript
    begin: |-
      (?x)
      ('|")
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.string.begin.gdscript
    end: |-
      (?x)
      (\1)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-raw-quoted-multi-line:
    name: string.quoted.raw.multi.gdscript
    begin: |-
      (?x)
      (r)('''|""")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.raw.gdscript
      "2":
        name: punctuation.definition.string.begin.multi.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-raw"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-raw-quoted-single-line:
    name: string.quoted.raw.single.gdscript
    begin: |-
      (?x)
      (r)('|")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.raw.gdscript
      "2":
        name: punctuation.definition.string.begin.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-raw"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-name-quoted-multi-line:
    name: string.string-name.quoted.multi.gdscript
    begin: |-
      (?x)
      (&)('''|""")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.string-name.gdscript
      "2":
        name: punctuation.definition.string.string-name.begin.multi.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.string-name.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-name-quoted-single-line:
    name: string.string-name.quoted.single.gdscript
    begin: |-
      (?x)
      (&)('|")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.string-name.gdscript
      "2":
        name: punctuation.definition.string.string-name.begin.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.string-name.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-node-path-quoted-multi-line:
    name: string.node-path.quoted.multi.gdscript
    begin: |-
      (?x)
      (\^)('''|""")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.node-path.gdscript
      "2":
        name: punctuation.definition.string.node-path.begin.multi.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.node-path.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-node-path-quoted-single-line:
    name: string.node-path.quoted.single.gdscript
    begin: |-
      (?x)
      (\^)('|")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.node-path.gdscript
      "2":
        name: punctuation.definition.string.node-path.begin.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.node-path.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-line-continuation:
    name: punctuation.separator.continuation.line.string.gdscript
    match: |-
      (?x)
      \\$
      # regex-end

  _string-escape-sequence-unicode:
    name: constant.character.escape.gdscript
    match: |-
      (?x)
      \\(
          u[A-Fa-f0-9]{4}
          | U[A-Fa-f0-9]{8}
        )
      # regex-end

  _string-escape-sequence:
    name: constant.character.escape.gdscript
    match: |-
      (?x)
      \\(
          [\\"'abfnrtv]
        )
      # regex-end

  _string-escape-sequence-raw:
    name: constant.character.escape.gdscript
    match: |-
      (?x)
      \\(
          [\\"']
        )
      # regex-end

  _string-formatting:
    name: meta.format.percent.gdscript
    match: |-
      (?x)
      (?:
        (%%)
        | (?:
            (%)
            (
              ([-+0 ]*)
              ([0-9]+|\*)? (\.([0-9]+|\*))?
              ([Xcdfosvx])
            )
          )
      )
      # regex-end
    captures:
      "1":
        name: constant.character.escape.gdscript
      "2":
        name: constant.character.format.placeholder.other.gdscript
      "3":
        name: storage.type.format.gdscript

  _string-brace-formatting:
    name: "meta.format.brace.gdscript"
    match: |-
      (?x)
      (
        {
          ([^\}"']*)
        }
      )
      # regex-end
    captures:
      "1":
        name: "constant.character.format.placeholder.other.gdscript"

  _builtin_get_node_shorthand:
    patterns:
      - include: "#_builtin_get_node_shorthand_quoted_multi"
      - include: "#_builtin_get_node_shorthand_quoted_single"
      - include: "#_builtin_get_node_shorthand_unquoted"

  _builtin_get_node_shorthand_quoted_multi:
    name: "string.quoted.multi.gdscript meta.literal.node-shorthand.gdscript"
    begin: |-
      (?x)
      (?:(\$)|(%)|(?:(\$)(%)))
      ("""|''')
      # regex-end
    beginCaptures:
      "1":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.gdscript"
      "2":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.unique.gdscript"
      "3":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.gdscript"
      "4":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.unique.gdscript"
      "5":
        name: punctuation.definition.string.begin.multi.gdscript
    end: |-
      (?x)
      (\3)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"
      - match: |-
          (?x)
          %
          # regex-end
        name: punctuation.definition.node-shorthand.unique.gdscript
      - match: |-
          (?x)
          /
          # regex-end
        name: punctuation.separator.path.gdscript
      - match: |-
          (?x)
          :
          # regex-end
        name: punctuation.separator.property.gdscript

  _builtin_get_node_shorthand_quoted_single:
    name: "string.quoted.single.gdscript meta.literal.node-shorthand.gdscript"
    begin: |-
      (?x)
      (?:(\$)|(%)|(?:(\$)(%)))
      ("|')
      # regex-end
    beginCaptures:
      "1":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.gdscript"
      "2":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.unique.gdscript"
      "3":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.gdscript"
      "4":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.unique.gdscript"
      "5":
        name: punctuation.definition.string.begin.gdscript
    end: |-
      (?x)
      (\5)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"
      - match: |-
          (?x)
          %
          # regex-end
        name: punctuation.definition.node-shorthand.unique.gdscript
      - match: |-
          (?x)
          /
          # regex-end
        name: punctuation.separator.path.gdscript
      - match: |-
          (?x)
          :
          # regex-end
        name: punctuation.separator.property.gdscript

  _builtin_get_node_shorthand_unquoted:
    name: string.unquoted.gdscript meta.literal.node-shorthand.bare.gdscript
    begin: |-
      (?x)
      (?:(\$)|(%)|(?:(\$)(%)))
      [ \t]*
      (/)?
      [ \t]*
      ([A-Za-z_][A-Za-z0-9_]*)
      # regex-end
    beginCaptures:
      "1":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.gdscript"
      "2":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.unique.gdscript"
      "3":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.gdscript"
      "4":
        name: "storage.type.string.node-shorthand.gdscript punctuation.definition.node-shorthand.unique.gdscript"
      "5":
        name: punctuation.separator.path.gdscript
    end: |-
      (?x)
      (?!
        [ \t]*
        /
        [ \t]*
        %?
        [ \t]*
        [A-Za-z_][A-Za-z0-9_]*
      )
      # regex-end
    patterns:
      - include: "#line-continuation"
      - match: |-
          (?x)
          [ \t]*
          (/)
          [ \t]*
          (%)?
          [ \t]*
          ([A-Za-z_][A-Za-z0-9_]*)
          # regex-end
        captures:
          "1":
            name: punctuation.separator.path.gdscript
          "2":
            name: punctuation.definition.node-shorthand.unique.gdscript
