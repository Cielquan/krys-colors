          # regex-end
        name: punctuation.definition.node-reference.unique.gdscript
      - match: |-
          (?x)
          /
          # regex-end
        name: punctuation.separator.path.gdscript
      - match: |-
          (?x)
          :
          # regex-end
        name: punctuation.separator.property.gdscript

  node-reference-quoted-single:
    name: "string.quoted.single.gdscript meta.literal.node-reference.gdscript"
    begin: |-
      (?x)
      (?:
        (\$)
        | (%)
        | (?:(\$)(%))
      )
      ("|')
      # regex-end
    beginCaptures:
      "1":
        name: "storage.type.string.node-reference.gdscript punctuation.definition.node-reference.gdscript"
      "2":
        name: "storage.type.string.node-reference.gdscript punctuation.definition.node-reference.unique.gdscript"
      "3":
        name: "storage.type.string.node-reference.gdscript punctuation.definition.node-reference.gdscript"
      "4":
        name: "storage.type.string.node-reference.gdscript punctuation.definition.node-reference.unique.gdscript"
      "5":
        name: punctuation.definition.string.begin.gdscript
    end: |-
      (?x)
      (\5)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.gdscript
    patterns:
      - include: "#_string-escape-sequences-normal"
      - include: "#_string-line-continuation"
      - include: "#_string-formattings"
      - match: |-
          (?x)
          %
          # regex-end
        name: punctuation.definition.node-reference.unique.gdscript
      - match: |-
          (?x)
          /
          # regex-end
        name: punctuation.separator.path.gdscript
      - match: |-
          (?x)
          :
          # regex-end
        name: punctuation.separator.property.gdscript

  node-reference-unquoted:
    name: string.unquoted.gdscript meta.literal.node-reference.bare.gdscript
    begin: |-
      (?x)
      (?:(\$)|(%)|(?:(\$)(%)))
      [ \t]*
      (/)?
      [ \t]*
      ([A-Za-z_][A-Za-z0-9_]*)
      # regex-end
    beginCaptures:
      "1":
        name: "storage.type.string.node-reference.gdscript punctuation.definition.node-reference.gdscript"
      "2":
        name: "storage.type.string.node-reference.gdscript punctuation.definition.node-reference.unique.gdscript"
      "3":
        name: "storage.type.string.node-reference.gdscript punctuation.definition.node-reference.gdscript"
      "4":
        name: "storage.type.string.node-reference.gdscript punctuation.definition.node-reference.unique.gdscript"
      "5":
        name: punctuation.separator.path.gdscript
    end: |-
      (?x)
      (?!
        [ \t]*
        /
        [ \t]*
        %?
        [ \t]*
        [A-Za-z_][A-Za-z0-9_]*
      )
      # regex-end
    patterns:
      - include: "#line-continuation"
      - match: |-
          (?x)
          [ \t]*
          (/)
          [ \t]*
          (%)?
          [ \t]*
          ([A-Za-z_][A-Za-z0-9_]*)
          # regex-end
        captures:
          "1":
            name: punctuation.separator.path.gdscript
          "2":
            name: punctuation.definition.node-reference.unique.gdscript

  _string-escape-sequences-normal:
    patterns:
      - comment: "Character string escape sequences"
        name: constant.character.escape.gdscript
        match: |-
          (?x)
          \\(
              [\\"'abfnrtv]
            )
          # regex-end

      - comment: "Unicode string escape sequences"
        name: constant.character.escape.gdscript
        match: |-
          (?x)
          \\(
              u[A-Fa-f0-9]{4}
              | U[A-Fa-f0-9]{6}
            )
          # regex-end

      - comment: "Invalid named unicode string escape sequence"
        name: invalid.illegal.escape.gdscript
        match: |-
          (?x)
          \\(
              N\{.*?\}
            )
          # regex-end

      - comment: "Invalid byte sequence string escape sequence"
        name: invalid.illegal.escape.gdscript
        match: |-
          (?x)
          \\(
              x[A-Fa-f0-9]{2}
            )
          # regex-end

  _string-escape-sequences-raw:
    patterns:
      - name: constant.character.escape.gdscript
        match: |-
          (?x)
          \\(
              [\\"']
            )
          # regex-end

  _string-line-continuation:
    name: punctuation.separator.continuation.line.string.gdscript
    match: |-
      (?x)
      \\$
      # regex-end

  _string-formattings:
    patterns:
      - comment: "Percent style string formatting"
        name: meta.format.percent.gdscript
        match: |-
          (?x)
          (?:
            (%%)
            | (?:
                (%)
                (
                  ([-+0 ]*)
                  ([0-9]+|\*)? (\.([0-9]+|\*))?
                  ([Xcdfosvx])
                )
              )
          )
          # regex-end
        captures:
          "1":
            name: constant.character.escape.gdscript
          "2":
            name: constant.character.format.placeholder.other.gdscript
          "3":
            name: storage.type.format.gdscript

      - comment: "Brace style string formatting"
        name: "meta.format.brace.gdscript"
        match: |-
          (?x)
          (
            {
              ([^\}"']*)
            }
          )
          # regex-end
        captures:
          "1":
            name: "constant.character.format.placeholder.other.gdscript"

  dict-literal:
    name: meta.literal.dict.gdscript
    begin: |-
      (?x)
      ([{])
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.dict.begin.gdscript
    end: |-
      (?x)
      ([}])
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.dict.end.gdscript
    patterns:
      - name: punctuation.separator.key-value.gdscript
        match: |-
          (?x)
          (:)
          # regex-end
      - name: punctuation.separator.comma.gdscript
        match: |-
          (?x)
          (,)
          # regex-end
      - name: keyword.operator.unpacking.pattern.gdscript
        match: |-
          (?x)
          (\.\.)
          # regex-end
      - include: "#_match-pattern-var-declarations"
      - include: "#expression"

  array-literal:
    name: meta.literal.array.gdscript
    begin: |-
      (?x)
      (\[)
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.array.begin.gdscript
    end: |-
      (?x)
      (\])
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.array.end.gdscript
    patterns:
      - name: punctuation.separator.comma.gdscript
        match: |-
          (?x)
          (,)
          # regex-end
      - name: keyword.operator.unpacking.pattern.gdscript
        match: |-
          (?x)
          (\.\.)
          # regex-end
      - include: "#_match-pattern-var-declarations"
      - include: "#expression"

  _match-pattern-var-declarations:
    name: meta.pattern.var.declaration.gdscript
    begin: |-
      (?x)
      \b(var)
      [ \t]+
      (?=
        ([A-Za-z_][A-Za-z0-9_]*)
        [ \t]*
      )
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.var.gdscript
    end: |-
      (?x)
      (?=[,\]}])
      # regex-end
    patterns:
      - comment: "Var name"
        patterns:
          - include: "#_builtin-functions"
          - include: "#builtin-type-primitive"
          - include: "#builtin-type-container"
          - include: "#builtin-type-vector"
          - include: "#builtin-type-variant"
          - name: variable.other.readwrite.gdscript
            match: |-
              (?x)
              ([A-Za-z_][A-Za-z0-9_]*)
              # regex-end

  # ----------------------------------------------
  # NOTE: Operators
  # ----------------------------------------------

  operators-assignment-basic:
    match: |-
      (?x)
      (?:
        (:=)
        | (?<![=<>!])(=)(?![=])
      )
      # regex-end
    captures:
      "1":
        name: keyword.operator.assignment.infer.gdscript
      "2":
        name: keyword.operator.assignment.equal.gdscript

  operators-arithmetic:
    match: |-
      (?x)
      (?:
        ([*]{2})
        | ([*])
        | (/)
        | (%)
        | ([+])
        | (-)(?![>])
      )(?![=])
      # regex-end
    captures:
      "1":
        name: keyword.operator.arithmetic.pow.gdscript
      "2":
        name: keyword.operator.arithmetic.mult.gdscript
      "3":
        name: keyword.operator.arithmetic.div.gdscript
      "4":
        name: keyword.operator.arithmetic.mod.gdscript
      "5":
        name: keyword.operator.arithmetic.add.gdscript
      "6":
        name: keyword.operator.arithmetic.sub.gdscript

  operators-arithmetic-assignment:
    match: |-
      (?x)
      (?:
        ([*]{2}=)
        | ([*]=)
        | (/=)
        | (%=)
        | ([+]=)
        | (-=)
      )
      # regex-end
    captures:
      "1":
        name: keyword.operator.assignment.arithmetic.pow.gdscript
      "2":
        name: keyword.operator.assignment.arithmetic.mult.gdscript
      "3":
        name: keyword.operator.assignment.arithmetic.div.gdscript
      "4":
        name: keyword.operator.assignment.arithmetic.mod.gdscript
      "5":
        name: keyword.operator.assignment.arithmetic.add.gdscript
      "6":
        name: keyword.operator.assignment.arithmetic.sub.gdscript

  operators-bitwise:
    match: |-
      (?x)
      (?:
        (~)
        | (?![&])(&)(?![&"'])
        | (\|)(?![|])
        | (\^)(?!["'])
        | (<<)
        | (>>)
      )(?![=])
      # regex-end
    captures:
      "1":
        name: keyword.operator.bitwise.not.gdscript
      "2":
        name: keyword.operator.bitwise.and.gdscript
      "3":
        name: keyword.operator.bitwise.or.gdscript
      "4":
        name: keyword.operator.bitwise.xor.gdscript
      "5":
        name: keyword.operator.bitwise.shift.left.gdscript
      "6":
        name: keyword.operator.bitwise.shift.right.gdscript

  operators-bitwise-assignment:
    match: |-
      (?x)
      (?:
        (&=)
        | (\|=)
        | (\^=)
        | (<<=)
        | (>>=)
      )
      # regex-end
    captures:
      "1":
        name: keyword.operator.assignment.bitwise.and.gdscript
      "2":
        name: keyword.operator.assignment.bitwise.or.gdscript
      "3":
        name: keyword.operator.assignment.bitwise.xor.gdscript
      "4":
        name: keyword.operator.assignment.bitwise.shift.left.gdscript
      "5":
        name: keyword.operator.assignment.bitwise.shift.right.gdscript

  operators-logical:
    patterns:
      - match: |-
          (?x)
          \b(?:
            (and)
            | (or)
            | (not)
            | (in)
            | (is)
          )\b
          # regex-end
        captures:
          "1":
            name: keyword.operator.wordlike.logical.and.gdscript
          "2":
            name: keyword.operator.wordlike.logical.or.gdscript
          "3":
            name: keyword.operator.wordlike.logical.not.gdscript
          "4":
            name: keyword.operator.wordlike.logical.in.gdscript
          "5":
            name: keyword.operator.wordlike.logical.is.gdscript
      - match: |-
          (?x)
          (?:
            (&&)
            | (\|\|)
            | (!)(?!=)
          )
          # regex-end
        captures:
          "1":
            name: keyword.operator.logical.and.gdscript
          "2":
            name: keyword.operator.logical.or.gdscript
          "3":
            name: keyword.operator.logical.not.gdscript

  operators-comparison:
    patterns:
      - match: |-
          (?x)
          (?:
            (==)
            | (!=)
            | (<=)
            | (>=)
            | (<)(?!-)
            | (?<!-)(>)
          )
          # regex-end
        captures:
          "1":
            name: keyword.operator.comparison.eq.gdscript
          "2":
            name: keyword.operator.comparison.neq.gdscript
          "3":
            name: keyword.operator.comparison.lte.gdscript
          "4":
            name: keyword.operator.comparison.gte.gdscript
          "5":
            name: keyword.operator.comparison.lt.gdscript
          "6":
            name: keyword.operator.comparison.gt.gdscript

  # ----------------------------------------------
  # NOTE: Punctuation
  # ----------------------------------------------

  line-continuation:
    patterns:
      - match: |-
          (?x)
          (\\)([ \t]*\S.*)?$\n?
          # regex-end
        captures:
          "1":
            name: punctuation.separator.continuation.line.gdscript
          "2":
            name: invalid.illegal.line.continuation.gdscript

  semicolon:
    name: punctuation.terminator.statement.gdscript
    match: |-
      (?x)
      ;
      # regex-end

  section-colon:
    name: punctuation.section.begin.gdscript
    match: |-
      (?x)
      (:|(?=[;#\n]))
      # regex-end

  accessor-dot:
    name: punctuation.accessor.gdscript
    match: |-
      (?x)
      (?<=[A-Za-z0-9_ \t\]\)])
      (\.)
      (?=[A-Za-z0-9_])
      # regex-end

  # ----------------------------------------------
  # NOTE: Helpers
  # ----------------------------------------------

  _type-annotations:
    patterns:
      - include: "#builtin-type-primitive"
      - include: "#builtin-type-container"
