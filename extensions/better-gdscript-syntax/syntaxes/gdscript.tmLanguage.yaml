---
name: GDScript

scopeName: source.gdscript

fileTypes:
  - gd

patterns:
  - include: "#comment-documentation-codeblock"
  - include: "#comment-documentation"
  - include: "#comment-region"
  - include: "#comment"
  - include: "#enum-declaration"
  - include: "#class-declaration"
  - include: "#class-name-declaration"
  - include: "#extends-declaration"
  - include: "#line-continuation"
  - include: "#semicolon"

repository:
  comment:
    name: comment.line.number-sign.gdscript
    begin: |-
      (?x)
      [ \t]*([#])
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.number-sign.gdscript
    end: |-
      (?x)
      $
      # regex-end

  comment-documentation:
    name: "comment.block.documentation.gdscript comment.line.documentation.gdscript"
    begin: |-
      (?x)
      [ \t]*([#]{2})
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.documentation.gdscript
    end: |-
      (?x)
      $
      # regex-end
    patterns:
      - match: |-
          (?x)
          (?<=[#])
          [ \t]*
          (@tutorial)
          (\([^\)]*\))?
          (:)
          # regex-end
        captures:
          "1":
            name: markup.other.tag.tutorial.gdscript
          "2":
            name: markup.heading.tag.tutorial.gdscript
          "3":
            name: punctuation.separator.key-value.gdscript
      - match: |-
          (?x)
          (?<=[#])
          [ \t]*
          (?:
            (@deprecated)
            |(@experimental)
          )
          (?![ \t]+:)
          (:)?
          # regex-end
        captures:
          "1":
            name: markup.other.tag.deprecated.gdscript
          "2":
            name: markup.other.tag.experimental.gdscript
          "3":
            name: punctuation.separator.key-value.gdscript
      - name: constant.character.escape.comment.documentation.gdscript
        match: |-
          (?x)
          \[
            (lb|rb|br)
          \]
          # regex-end
      - name: markup.bold.comment.documentation.gdscript
        begin: |-
          (?x)
          \[(b)\]
          # regex-end
        end: |-
          (?x)
          \[/\1\] | $
          # regex-end
      - name: markup.italic.comment.documentation.gdscript
        begin: |-
          (?x)
          \[(i)\]
          # regex-end
        end: |-
          (?x)
          \[/\1\] | $
          # regex-end
      - name: markup.underline.comment.documentation.gdscript
        begin: |-
          (?x)
          \[(u)\]
          # regex-end
        end: |-
          (?x)
          \[/\1\] | $
          # regex-end
      - name: markup.strikethrough.comment.documentation.gdscript
        begin: |-
          (?x)
          \[(s)\]
          # regex-end
        end: |-
          (?x)
          \[/\1\] | $
          # regex-end
      - comment: "Opening tags with optional attributes"
        match: |-
          (?x)
          (\[)
          (?:
            (?:
              (color)
              |(font)
              |(img)
              |(url)
              |(center)
            )
            (?:
              (=)
              ([^\]]*)
            )?
            (?:
              [ \t]+
              ([A-Za-z_-][A-Za-z0-9_-]*)
              (?:
                (=)
                ([^\]]*)
              )?
            )*
          )
          (\])
          # regex-end
        captures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.color.gdscript
          "3":
            name: entity.name.tag.font.gdscript
          "4":
            name: entity.name.tag.img.gdscript
          "5":
            name: entity.name.tag.url.gdscript
          "6":
            name: entity.name.tag.center.gdscript
          "7":
            name: punctuation.separator.key-value.gdscript
          "8":
            name: string.unquoted.gdscript
          "9":
            name: entity.other.attribute-name.gdscript
          "10":
            name: punctuation.separator.key-value.gdscript
          "11":
            name: string.unquoted.gdscript
          "12":
            name: punctuation.definition.tag.end.gdscript
      - comment: "Closing tags"
        match: |-
          (?x)
          (\[)
          (/)
          (?:
            (color)
            |(font)
            |(img)
            |(url)
            |(center)
          )
          (\])
          # regex-end
        captures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.gdscript
          "3":
            name: entity.name.tag.color.gdscript
          "4":
            name: entity.name.tag.font.gdscript
          "5":
            name: entity.name.tag.img.gdscript
          "6":
            name: entity.name.tag.url.gdscript
          "7":
            name: entity.name.tag.center.gdscript
          "8":
            name: punctuation.definition.tag.end.gdscript
      - contentName: source.gdscript
        begin: |-
          (?x)
          (\[)
            (kbd)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:
            (\[)
            (/\2)
            (\])
          )
          | $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - name: meta.comment.documentation.tag.code.gdscript
        contentName: source.text
        begin: |-
          (?x)
          (\[)
            (code)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.code.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:
            (\[)
            (/\2)
            (\])
          )
          | $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - name: meta.comment.documentation.link.class-reference.gdscript
        # TODO: split pattern and use correct scopes for the link label
        match: |-
          (?x)
          \[
          (?:
            (annotation|constant|enum|member|method|constructor|operator|signal|theme_item|param)
            [ \t]+
          )?
          ([^\]]+)
          \]
          # regex-end
        captures:
          "1":
            name: string.other.link.comment.documentation.gdscript
          "2":
            name: markup.underline.link.comment.documentation.gdscript

  comment-documentation-codeblock:
    patterns:
      - name: "comment.block.documentation.gdscript comment.line.documentation.gdscript meta.comment.documentation.tag.codeblock.gdscript.gdscript"
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#]{2})
          [ \t]*
          (\[)
          (?:
            (codeblock)
            (?:
              [ \t]+
              ([lang]{0,4})
              (=)?
              ([a-z0-9]*)
            )?
          )
          (\])
          [ \t]*
          $
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.documentation.gdscript
          "2":
            name: punctuation.definition.tag.begin.gdscript
          "3":
            name: entity.name.tag.codeblock.gdscript
          "4":
            name: entity.other.attribute-name.gdscript
          "5":
            name: punctuation.separator.key-value.gdscript
          "6":
            name: string.unquoted.gdscript
          "7":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#]{2})
          [ \t]*
          (\[)
            (/codeblock)
          (\])
          [ \t]*
          $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.comment.documentation.gdscript
          "2":
            name: punctuation.definition.tag.begin.gdscript
          "3":
            name: entity.name.tag.codeblock.gdscript
          "4":
            name: punctuation.definition.tag.end.gdscript
        patterns:
          - contentName: source.text
            begin: |-
              (?x)
              (?:^|\G)
              [ \t]*
              ([#]{2})
              # regex-end
            beginCaptures:
              "1":
                name: punctuation.definition.comment.documentation.gdscript
            end: |-
              (?x)
              $
              # regex-end

  comment-region-full-line:
    patterns:
      - name: comment.block.region.gdscript
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#])
          (region)
          (?:
            [ \t]+
            (.*)
          )?
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.number-sign.gdscript
          "2":
            name: keyword.declaration.region.gdscript
          "3":
            name: entity.name.section.gdscript
        end: |-
          (?x)
          $
          # regex-end
      - name: comment.block.region.gdscript
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#])
          (endregion)
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.number-sign.gdscript
          "2":
            name: keyword.declaration.region.gdscript
        end: |-
          (?x)
          $
          # regex-end

  class-name-declaration:
    name: meta.class.declaration.gdscript
    match: |-
      (?x)
      (?:^|\G)
      [ \t]*
      (class_name)
      [ \t]+
      ([A-Za-z_][A-Za-z0-9_]*)
      # regex-end
    captures:
      "1":
        name: storage.type.class.gdscript
      "2":
        name: entity.name.type.class.gdscript

  class-declaration:
    name: meta.class.declaration.gdscript
    contentName: entity.other.inherited-class.gdscript
    begin: |-
      (?x)
      (?:^|\G)
      [ \t]*
      (class)
      [ \t]+
      ([A-Za-z_][A-Za-z0-9_]*)
      (?:
        [ \t]+
        (extends)
        [ \t]+
      )?
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.class.gdscript
      "2":
        name: entity.name.type.class.gdscript
      "3":
        name: keyword.control.inheritance.gdscript
    end: |-
      (?x)
      (:)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.section.class.begin.gdscript
    patterns:
      - include: "#_string-quoted-multi-line"
      - include: "#_string-quoted-single-line"
      - include: "#_string-raw-quoted-multi-line"
      - include: "#_string-raw-quoted-single-line"
      - match: |-
          (?x)
          (\.)?
          ([A-Za-z_][A-Za-z0-9_]*)
          # regex-end

  extends-declaration:
    name: meta.class.declaration.gdscript
    contentName: entity.other.inherited-class.gdscript
    begin: |-
      (?x)
      [ \t]*
      (extends)
      [ \t]+
      # regex-end
    beginCaptures:
      "1":
        name: keyword.control.inheritance.gdscript
    end: |-
      (?x)
      $
      # regex-end
    patterns:
      - include: "#_string-quoted-multi-line"
      - include: "#_string-quoted-single-line"
      - include: "#_string-raw-quoted-multi-line"
      - include: "#_string-raw-quoted-single-line"
      - match: |-
          (?x)
          (\.)?
          ([A-Za-z_][A-Za-z0-9_]*)
          # regex-end

  enum-declaration:
    name: meta.enum.declaration.gdscript
    begin: |-
      (?x)
      (?:^|\G)
      [ \t]*
      (enum)
      (?:
        [ \t]+
        ([A-Za-z_][A-Za-z0-9_]*)
      )?
      [ \t]*
      (\{)
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.enum.gdscript
      "2":
        name: entity.name.type.enum.gdscript
      "3":
        name: punctuation.definition.block.begin.gdscript
    end: |-
      (?x)
      (\})
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.block.end.gdscript
    patterns:
      - match: |-
          (?x)
          [ \t]*
          ([A-Za-z_][A-Za-z0-9_]*)
          [ \t]*
          (?:
            (=)
            [ \t]*
            ([+-]?)
            [ \t]*
            ([0-9]*)
          )?
          (,)?
          # regex-end
        captures:
          "1":
            name: variable.other.enummember.gdscript
          "2":
            name: punctuation.separator.key-value.enum.gdscript
          "3":
            name: keyword.operator.arithmetic.gdscript
          "4":
            name: constant.numeric.dec.gdscript
          "5":
            name: punctuation.separator.comma.gdscript

  line-continuation:
    patterns:
      - match: |-
          (?x)
          (\\)([ \t]*\S.*)?$\n?
          # regex-end
        captures:
          "1":
            name: punctuation.separator.continuation.line.gdscript
          "2":
            name: invalid.illegal.line.continuation.gdscript

  semicolon:
    name: punctuation.terminator.statement.gdscript
    match: |-
      (?x)
      ;
      # regex-end

  _language-constants:
    name: constant.language.gdscript
    match: |-
      (?x)
      \b(?:(true)|(false)|(null)|(PI)|(TAU)|(INF)|(NAN))\b
      # regex-end
    captures:
      "1":
        name: constant.language.bool.true.gdscript
      "2":
        name: constant.language.bool.false.gdscript
      "3":
        name: constant.language.null.gdscript
      "4":
        name: constant.language.number.pi.gdscript
      "5":
        name: constant.language.number.tau.gdscript
      "6":
        name: constant.language.number.inf.gdscript
      "7":
        name: constant.language.number.nan.gdscript

  _numbers:
    patterns:
      - name: constant.numeric.hex.gdscript
        match: |-
          (?x)
          (0[Xx])[A-Fa-f0-9][A-Fa-f0-9_]*
          # regex-end
        captures:
          "1":
            name: storage.type.number.gdscript

      - name: constant.numeric.bin.gdscript
        match: |-
          (?x)
          (0[Bb])[0-1][0-1_]*
          # regex-end
        captures:
          "1":
            name: storage.type.number.gdscript

      - name: constant.numeric.float.gdscript
        match: |-
          (?x)
          (
            ([0-9][0-9_]*)\.([0-9][0-9_]*)?
            | ([0-9][0-9_]*)?\.([0-9][0-9_]*)
          )
          ([Ee][+-]?([0-9][0-9_]*))?
          # regex-end

      - name: constant.numeric.dec.gdscript
        match: |-
          (?x)
          [0-1][0-1_]*
          # regex-end

      - comment: fallback for malformed numbers
        name: invalid.illegal.name.gdscript
        match: |-
          (?x)
          \b[0-9]+[A-Za-z0-9_]+
          # regex-end

  _reserved-keywords:
    name: invalid.illegal.word.gdscript
    match: |-
      (?x)
      \b(namespace|trait|yield)\b
      # regex-end

  _strings:
    patterns:
      - include: "#_string-quoted-multi-line"
      - include: "#_string-quoted-single-line"
      - include: "#_string-raw-quoted-multi-line"
      - include: "#_string-raw-quoted-single-line"

      - include: "#_string-name-quoted-multi-line"
      - include: "#_string-name-quoted-single-line"

      - include: "#_string-node-path-quoted-multi-line"
      - include: "#_string-node-path-quoted-single-line"

  _string-quoted-multi-line:
    name: string.quoted.multi.gdscript
    begin: |-
      (?x)
      ('''|""")
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.string.begin.multi.gdscript
    end: |-
      (?x)
      (\1)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-escape-sequence-byte"
      - include: "#_string-escape-sequence-unicode-named"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-quoted-single-line:
    name: string.quoted.single.gdscript
    begin: |-
      (?x)
      ('|")
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.string.begin.gdscript
    end: |-
      (?x)
      (\1)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-escape-sequence-byte"
      - include: "#_string-escape-sequence-unicode-named"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-raw-quoted-multi-line:
    name: string.quoted.raw.multi.gdscript
    begin: |-
      (?x)
      (r)('''|""")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.raw.gdscript
      "2":
        name: punctuation.definition.string.begin.multi.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-raw"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-raw-quoted-single-line:
    name: string.quoted.raw.single.gdscript
    begin: |-
      (?x)
      (r)('|")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.raw.gdscript
      "2":
        name: punctuation.definition.string.begin.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-raw"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-name-quoted-multi-line:
    name: string.string-name.quoted.multi.gdscript
    begin: |-
      (?x)
      (&)('''|""")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.string-name.gdscript
      "2":
        name: punctuation.definition.string.string-name.begin.multi.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.string-name.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-escape-sequence-byte"
      - include: "#_string-escape-sequence-unicode-named"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-name-quoted-single-line:
    name: string.string-name.quoted.single.gdscript
    begin: |-
      (?x)
      (&)('|")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.string-name.gdscript
      "2":
        name: punctuation.definition.string.string-name.begin.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.string-name.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-escape-sequence-byte"
      - include: "#_string-escape-sequence-unicode-named"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-node-path-quoted-multi-line:
    name: string.node-path.quoted.multi.gdscript
    begin: |-
      (?x)
      (\^)('''|""")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.node-path.gdscript
      "2":
        name: punctuation.definition.string.node-path.begin.multi.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.node-path.end.multi.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-escape-sequence-byte"
      - include: "#_string-escape-sequence-unicode-named"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-node-path-quoted-single-line:
    name: string.node-path.quoted.single.gdscript
    begin: |-
      (?x)
      (\^)('|")
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.string.node-path.gdscript
      "2":
        name: punctuation.definition.string.node-path.begin.gdscript
    end: |-
      (?x)
      (\2)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.string.node-path.end.gdscript
    patterns:
      - include: "#_string-escape-sequence-unicode"
      - include: "#_string-escape-sequence"
      - include: "#_string-escape-sequence-byte"
      - include: "#_string-escape-sequence-unicode-named"
      - include: "#_string-line-continuation"
      - include: "#_string-formatting"
      - include: "#_string-brace-formatting"

  _string-line-continuation:
    name: punctuation.separator.continuation.line.string.gdscript
    match: |-
      (?x)
      \\$
      # regex-end

  _string-escape-sequence-unicode:
    name: constant.character.escape.gdscript
    match: |-
      (?x)
      \\(
          u[A-Fa-f0-9]{4}
          | U[A-Fa-f0-9]{6}
        )
      # regex-end

  _string-escape-sequence:
    name: constant.character.escape.gdscript
    match: |-
      (?x)
      \\(
          [\\"'abfnrtv]
        )
      # regex-end

  _string-escape-sequence-raw:
    name: constant.character.escape.gdscript
    match: |-
      (?x)
      \\(
          [\\"']
        )
      # regex-end

  _string-escape-sequence-unicode-named:
    name: invalid.illegal.escape.gdscript
    match: |-
      (?x)
      \\(
          N\{.*?\}
        )
      # regex-end

  _string-escape-sequence-byte:
    name: invalid.illegal.escape.gdscript
    match: |-
      (?x)
      \\(
          x[A-Fa-f0-9]{2}
        )
      # regex-end

  _string-formatting:
    name: meta.format.percent.gdscript
    match: |-
      (?x)
      (?:
        (%%)
        | (?:
            (%)
            (
              ([-+0 ]*)
              ([0-9]+|\*)? (\.([0-9]+|\*))?
              ([Xcdfosvx])
            )
          )
