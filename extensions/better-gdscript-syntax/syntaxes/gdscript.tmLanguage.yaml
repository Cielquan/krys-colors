---
name: GDScript

scopeName: source.gdscript

fileTypes:
  - gd

patterns:
  - include: "#comment-documentation-codeblock"
  - include: "#comment-documentation"
  - include: "#comment-region"
  - include: "#comment"
  - include: "#enum-declaration"
  - include: "#class-declaration"
  - include: "#class-name-declaration"
  - include: "#extends-declaration"
  - include: "#line-continuation"
  - include: "#semicolon"

repository:
  comment:
    name: comment.line.number-sign.gdscript
    begin: |-
      (?x)
      [ \t]*([#])
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.number-sign.gdscript
    end: |-
      (?x)
      $
      # regex-end

  comment-documentation:
    name: "comment.block.documentation.gdscript comment.line.documentation.gdscript"
    begin: |-
      (?x)
      [ \t]*([#]{2})
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.documentation.gdscript
    end: |-
      (?x)
      $
      # regex-end
    patterns:
      - match: |-
          (?x)
          (?<=[#])
          [ \t]*
          (@tutorial)
          (\([^\)]*\))?
          (:)
          # regex-end
        captures:
          "1":
            name: markup.other.tag.tutorial.gdscript
          "2":
            name: markup.heading.tag.tutorial.gdscript
          "3":
            name: punctuation.separator.key-value.gdscript
      - match: |-
          (?x)
          (?<=[#])
          [ \t]*
          (?:
            (@deprecated)
            | (@experimental)
          )\b
          (?![ \t]+:)
          (:)?
          # regex-end
        captures:
          "1":
            name: markup.other.tag.deprecated.gdscript
          "2":
            name: markup.other.tag.experimental.gdscript
          "3":
            name: punctuation.separator.key-value.gdscript
      - match: |-
          (?x)
          (\[)
            (br)
          (\])
          # regex-end
        captures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.line-break.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - name: constant.character.escape.comment.documentation.gdscript
        match: |-
          (?x)
          \[
            (lb|rb)
          \]
          # regex-end
      - contentName: markup.bold.comment.documentation.gdscript
        begin: |-
          (?x)
          (\[)
            (b)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.bold.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (\[/)
            (\2)
          (\])
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.bold.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - contentName: markup.italic.comment.documentation.gdscript
        begin: |-
          (?x)
          (\[)
            (i)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.italic.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (\[/)
            (\2)
          (\])
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.italic.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - contentName: markup.underline.comment.documentation.gdscript
        begin: |-
          (?x)
          (\[)
            (u)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.underline.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (\[/)
            (\2)
          (\])
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.underline.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - contentName: markup.strikethrough.comment.documentation.gdscript
        begin: |-
          (?x)
          (\[)
            (s)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.strikethrough.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (\[/)
            (\2)
          (\])
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.strikethrough.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - comment: "Opening tags with optional attributes"
        match: |-
          (?x)
          (\[)
          (?:
            (?:
              (color)
              | (font)
              | (img)
              | (url)
              | (center)
            )\b
            (?:
              (=)
              ([^\]]*)
            )?
            (?:
              [ \t]+
              ([A-Za-z_-][A-Za-z0-9_-]*)
              (?:
                (=)
                ([^\]]*)
              )?
            )*
          )
          (\])
          # regex-end
        captures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.color.gdscript
          "3":
            name: entity.name.tag.font.gdscript
          "4":
            name: entity.name.tag.img.gdscript
          "5":
            name: entity.name.tag.url.gdscript
          "6":
            name: entity.name.tag.center.gdscript
          "7":
            name: punctuation.separator.key-value.gdscript
          "8":
            name: string.unquoted.gdscript
          "9":
            name: entity.other.attribute-name.gdscript
          "10":
            name: punctuation.separator.key-value.gdscript
          "11":
            name: string.unquoted.gdscript
          "12":
            name: punctuation.definition.tag.end.gdscript
      - comment: "Closing tags"
        match: |-
          (?x)
          (\[/)
          (?:
            (color)
            | (font)
            | (img)
            | (url)
            | (center)
          )
          (\])
          # regex-end
        captures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.color.gdscript
          "3":
            name: entity.name.tag.font.gdscript
          "4":
            name: entity.name.tag.img.gdscript
          "5":
            name: entity.name.tag.url.gdscript
          "6":
            name: entity.name.tag.center.gdscript
          "7":
            name: punctuation.definition.tag.end.gdscript
      - contentName: source.gdscript
        begin: |-
          (?x)
          (\[)
            (kbd)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.kbd.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:
            (\[/)
            (\2)
            (\])
          )
          | $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.kbd.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - name: meta.comment.documentation.tag.code.gdscript
        contentName: source.text
        begin: |-
          (?x)
          (\[)
            (code)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.code.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:
            (\[/)
            (\2)
            (\])
          )
          | $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.code.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - patterns:
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (annotation)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: storage.modifier.annotation.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (constant)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: variable.other.constant.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (enum)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: entity.name.type.enum.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (member)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: variable.other.property.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (method)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: entity.name.function.definition.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (constructor)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: entity.name.function.definition.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (operator)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: keyword.operator.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (signal)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: "entity.name.function.definition.gdscript entity.name.signal.definition.gdscript"
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (theme_item)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: variable.other.property.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              (\[)
              (param)\b
              (?:
                [ \t]+
                ([^\]]+)?
              )?
              (\])
              # regex-end
            captures:
              "1":
                name: punctuation.definition.tag.begin.gdscript
              "2":
                name: support.type.gdscript
              "3":
                name: variable.parameter.function.language.gdscript
              "4":
                name: punctuation.definition.tag.end.gdscript
          - name: meta.comment.documentation.link.class-reference.gdscript
            match: |-
              (?x)
              \[
              ([^\]]+)
              \]
              # regex-end
            captures:
              "1":
                name: entity.name.type.class.gdscript

  comment-documentation-codeblock:
    patterns:
      - name: "comment.block.documentation.gdscript comment.line.documentation.gdscript meta.comment.documentation.tag.codeblock.gdscript.gdscript"
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#]{2})
          [ \t]*
          (\[)
          (?:
            (codeblock)\b
            (?:
              [ \t]+
              ([lang]{0,4})
              (=)?
              ([a-z0-9]*)
            )?
          )
          (\])
          [ \t]*
          $
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.documentation.gdscript
          "2":
            name: punctuation.definition.tag.begin.gdscript
          "3":
            name: entity.name.tag.codeblock.gdscript
          "4":
            name: entity.other.attribute-name.gdscript
          "5":
            name: punctuation.separator.key-value.gdscript
          "6":
            name: string.unquoted.gdscript
          "7":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#]{2})
          [ \t]*
          (\[/)
            (codeblock)
          (\])
          [ \t]*
          $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.comment.documentation.gdscript
          "2":
            name: punctuation.definition.tag.begin.gdscript
          "3":
            name: entity.name.tag.codeblock.gdscript
          "4":
            name: punctuation.definition.tag.end.gdscript
        patterns:
          - contentName: source.text
            begin: |-
              (?x)
              (?:^|\G)
              [ \t]*
              ([#]{2})
              # regex-end
            beginCaptures:
              "1":
                name: punctuation.definition.comment.documentation.gdscript
            end: |-
              (?x)
              $
              # regex-end

  comment-region-full-line:
    patterns:
      - name: comment.block.region.gdscript
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#])
          (region)\b
          (?:
            [ \t]+
            (.*)
          )?
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.number-sign.gdscript
          "2":
            name: keyword.declaration.region.gdscript
          "3":
            name: entity.name.section.gdscript
        end: |-
          (?x)
          $
          # regex-end
      - name: comment.block.region.gdscript
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#])
          (endregion)\b
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.number-sign.gdscript
          "2":
            name: keyword.declaration.region.gdscript
        end: |-
          (?x)
          $
          # regex-end

  signal-declaration:
    name: meta.signal.gdscript
    begin: |-
      (?x)
      [ \t]*
      \b(signal)[ \t]+
      (?=
        ([A-Za-z_][A-Za-z0-9_]*)
        [ \t]*
        \(
      )
      # regex-end
    beginCaptures:
      "1":
        name: "storage.type.function.gdscript storage.type.signal.gdscript"
    end: |-
      (?x)
      (?=[#'"\n])
      # regex-end
    patterns:
      - comment: "Signal name"
        patterns:
          - include: "#_builtin-functions"
          - include: "#builtin-type-primitive"
          - include: "#builtin-type-container"
          - include: "#builtin-type-vector"
          - include: "#builtin-type-variant"
          - name: "entity.name.function.definition.gdscript entity.name.signal.definition.gdscript"
            match: |-
              (?x)
              ([A-Za-z_][A-Za-z0-9_]*)
              # regex-end
      - name: "meta.function.parameters.gdscript meta.signal.parameters.gdscript"
        patterns:
          - include: "#_parameters"
      - include: "#line-continuation"

  function-and-lambda-declaration:
    name: meta.function.gdscript
    begin: |-
      (?x)
      [ \t]*
      (?:
        (static)
        [ \t]+
      )?
      \b(func)[ \t]+
      (?=
        ([A-Za-z_][A-Za-z0-9_]*)?
        [ \t]*
        \(
      )
      # regex-end
    beginCaptures:
      "1":
        name: storage.modifier.static.gdscript
      "2":
        name: storage.type.function.gdscript
    end: |-
      (?x)
      (:|(?=[;#\n]))
      # regex-end
    endCaptures:
      "1":
        name: punctuation.section.function.begin.gdscript
    patterns:
      - comment: "Function name"
        patterns:
          - include: "#_builtin-functions"
          - include: "#builtin-type-primitive"
          - include: "#builtin-type-container"
          - include: "#builtin-type-vector"
          - include: "#builtin-type-variant"
          - name: entity.name.function.definition.gdscript
            match: |-
              (?x)
              ([A-Za-z_][A-Za-z0-9_]*)
              # regex-end
      - name: meta.function.parameters.gdscript
        patterns:
          - include: "#_parameters"
      - include: "#line-continuation"
      - comment: "Return type annotation"
        begin: |-
          (?x)
          (->)
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.separator.annotation.result.gdscript
        end: |-
          (?x)
          (?=[:;#\n])
          # regex-end
        patterns:
          - include: "#_type-annotation"

  _parameters:
    begin: |-
      (?x)
      (\()
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.parameters.begin.gdscript
    end: |-
      (?x)
      (\))
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.parameters.end.gdscript
    patterns:
      - name: keyword.operator.unpacking.parameter.gdscript
        match: |-
          (?x)
          (\.\.\.)
          # regex-end
      - include: "#function-and-lambda-declaration"
      - comment: "'self' parameter"
        match: |-
          (?x)
          \b(self)\b
          [ \t]*
          (?:
            (,)
            | (?=[)#\n=])
          )
          # regex-end
        captures:
          "1":
            name: variable.parameter.function.language.special.self.gdscript
          "2":
            name: punctuation.separator.parameters.gdscript
      - match: |-
          (?x)
          ([A-Za-z_][A-Za-z0-9_]*)
          [ \t]*
          (?:
            (,)
            | (?=[)#\n=])
          )
          # regex-end
        captures:
          "1":
            name: variable.parameter.function.language.gdscript
          "2":
            name: punctuation.separator.parameters.gdscript
      - include: "#comment-documentation"
      - include: "#comment"
      - comment: "Default value"
        begin: |-
          (?x)
          (?:
            (:=)
            | (?<!=)(=)(?!=)
          )
          # regex-end
        beginCaptures:
          "1":
            name: keyword.operator.assignment.infer.gdscript
          "2":
            name: keyword.operator.assignment.equal.gdscript
        end: |-
          (?x)
          (?:
            (,)
            | (?=[)#\n=])
          )
          # regex-end
        endCaptures:
          "1":
            name: punctuation.separator.parameters.gdscript
        patterns:
          - include: "#expression"
      - comment: "Type annotated parameter"
        begin: |-
          (?x)
          ([A-Za-z_][A-Za-z0-9_]*)
          [ \t]*
          (:)
          # regex-end
        beginCaptures:
          "1":
            name: variable.parameter.function.language.gdscript
          "2":
            name: punctuation.separator.annotation.gdscript
        end: |-
          (?x)
          (?:
            (,)
            | (?=[)#\n=])
          )
          # regex-end
        endCaptures:
          "1":
            name: punctuation.separator.parameters.gdscript
        patterns:
          - include: "#_type-annotation"
          - match: |-
              (?x)
              (?<!=)(=)(?!=)
              # regex-end
            captures:
              "1":
                name: keyword.operator.assignment.equal.gdscript
          - include: "#expression"

  _type-annotation:
    name: meta.type.annotation.gdscript
    patterns:
      - include: "#builtin-type-primitive"
      - include: "#builtin-type-container"
      - include: "#builtin-type-vector"
      - include: "#builtin-type-variant"
      - comment: "Generic type parameter"
        contentName: meta.item-access.arguments.gdscript
        begin: |-
          (?x)
          (\[)
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.arguments.begin.gdscript
        end: |-
          (?x)
          (\])
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.arguments.end.gdscript
        patterns:
          - include: "#_type-annotation"
          - include: "#expression"

  _builtin-functions:
    patterns:
      - name: keyword.control.flow.gdscript
        match: |-
          (?x)
          # @GDScript - meth - START
          \b(assert)\b
          # @GDScript - meth - END
          # regex-end
      - name: support.function.builtin.gdscript
        match: |-
          (?x)
          \b(?:
            # @GDScript - meth - START
            char
            | get_stack
            | is_instance_of
            | len
            | load
            | ord
            | preload
            | print_debug
            | print_stack
            | range
            # @GDScript - meth - END
          )\b
          # regex-end
      - name: invalid.deprecated.builtin.gdscript
        match: |-
          (?x)
          \b(?:
            # @GDScript - meth-deprecated - START
            Color8
            | convert
            | dict_to_inst
            | inst_to_dict
            | type_exists
            # @GDScript - meth-deprecated - END
          )\b
          # regex-end
      - name: support.function.builtin.math.gdscript
        match: |-
          (?x)
          \b(?:
            # @GlobalScope - meth - START
            abs
            | absf
            | absi
            | acos
            | acosh
            | angle_difference
            | asin
            | asinh
            | atan
            | atan2
