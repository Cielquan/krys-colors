      - comment: "Builtin input-related enum constants"
        name: constant.other.builtin.enummember.gdscript
        match: |-
          (?x)
          \b(
            # @GlobalScope - const - START
            MOUSE_BUTTON_LEFT                           (?# enum MouseButton)
            | MOUSE_BUTTON_MIDDLE                       (?# enum MouseButton)
