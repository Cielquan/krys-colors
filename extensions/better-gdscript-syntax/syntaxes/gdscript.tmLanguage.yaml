---
name: GDScript

scopeName: source.gdscript

fileTypes:
  - gd

patterns:
  - include: "#comment-documentation-codeblock"
  - include: "#comment-documentation"
  - include: "#comment-region"
  - include: "#comment"
  - include: "#enum-declaration"
  - include: "#class-declaration"
  - include: "#class-name-declaration"
  - include: "#extends-declaration"
  - include: "#line-continuation"
  - include: "#semicolon"

repository:
  comment:
    name: comment.line.number-sign.gdscript
    begin: |-
      (?x)
      [ \t]*([#])
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.number-sign.gdscript
    end: |-
      (?x)
      $
      # regex-end

  comment-documentation:
    name: "comment.block.documentation.gdscript comment.line.documentation.gdscript"
    begin: |-
      (?x)
      [ \t]*([#]{2})
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.comment.documentation.gdscript
    end: |-
      (?x)
      $
      # regex-end
    patterns:
      - match: |-
          (?x)
          (?<=[#])
          [ \t]*
          (@tutorial)
          (\([^\)]*\))?
          (:)
          # regex-end
        captures:
          "1":
            name: markup.other.tag.tutorial.gdscript
          "2":
            name: markup.heading.tag.tutorial.gdscript
          "3":
            name: punctuation.separator.key-value.gdscript
      - match: |-
          (?x)
          (?<=[#])
          [ \t]*
          (?:
            (@deprecated)
            | (@experimental)
          )
          (?![ \t]+:)
          (:)?
          # regex-end
        captures:
          "1":
            name: markup.other.tag.deprecated.gdscript
          "2":
            name: markup.other.tag.experimental.gdscript
          "3":
            name: punctuation.separator.key-value.gdscript
      - name: constant.character.escape.comment.documentation.gdscript
        match: |-
          (?x)
          \[
            (lb|rb|br)
          \]
          # regex-end
      - name: markup.bold.comment.documentation.gdscript
        begin: |-
          (?x)
          \[(b)\]
          # regex-end
        end: |-
          (?x)
          \[/\1\] | $
          # regex-end
      - name: markup.italic.comment.documentation.gdscript
        begin: |-
          (?x)
          \[(i)\]
          # regex-end
        end: |-
          (?x)
          \[/\1\] | $
          # regex-end
      - name: markup.underline.comment.documentation.gdscript
        begin: |-
          (?x)
          \[(u)\]
          # regex-end
        end: |-
          (?x)
          \[/\1\] | $
          # regex-end
      - name: markup.strikethrough.comment.documentation.gdscript
        begin: |-
          (?x)
          \[(s)\]
          # regex-end
        end: |-
          (?x)
          \[/\1\] | $
          # regex-end
      - comment: "Opening tags with optional attributes"
        match: |-
          (?x)
          (\[)
          (?:
            (?:
              (color)
              | (font)
              | (img)
              | (url)
              | (center)
            )
            (?:
              (=)
              ([^\]]*)
            )?
            (?:
              [ \t]+
              ([A-Za-z_-][A-Za-z0-9_-]*)
              (?:
                (=)
                ([^\]]*)
              )?
            )*
          )
          (\])
          # regex-end
        captures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.color.gdscript
          "3":
            name: entity.name.tag.font.gdscript
          "4":
            name: entity.name.tag.img.gdscript
          "5":
            name: entity.name.tag.url.gdscript
          "6":
            name: entity.name.tag.center.gdscript
          "7":
            name: punctuation.separator.key-value.gdscript
          "8":
            name: string.unquoted.gdscript
          "9":
            name: entity.other.attribute-name.gdscript
          "10":
            name: punctuation.separator.key-value.gdscript
          "11":
            name: string.unquoted.gdscript
          "12":
            name: punctuation.definition.tag.end.gdscript
      - comment: "Closing tags"
        match: |-
          (?x)
          (\[)
          (/)
          (?:
            (color)
            | (font)
            | (img)
            | (url)
            | (center)
          )
          (\])
          # regex-end
        captures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.gdscript
          "3":
            name: entity.name.tag.color.gdscript
          "4":
            name: entity.name.tag.font.gdscript
          "5":
            name: entity.name.tag.img.gdscript
          "6":
            name: entity.name.tag.url.gdscript
          "7":
            name: entity.name.tag.center.gdscript
          "8":
            name: punctuation.definition.tag.end.gdscript
      - contentName: source.gdscript
        begin: |-
          (?x)
          (\[)
            (kbd)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:
            (\[)
            (/\2)
            (\])
          )
          | $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - name: meta.comment.documentation.tag.code.gdscript
        contentName: source.text
        begin: |-
          (?x)
          (\[)
            (code)
          (\])
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.code.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:
            (\[)
            (/\2)
            (\])
          )
          | $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.tag.begin.gdscript
          "2":
            name: entity.name.tag.gdscript
          "3":
            name: punctuation.definition.tag.end.gdscript
      - name: meta.comment.documentation.link.class-reference.gdscript
        # TODO: split pattern and use correct scopes for the link label
        match: |-
          (?x)
          \[
          (?:
            (
              annotation
              | constant
              | enum
              | member
              | method
              | constructor
              | operator
              | signal
              | theme_item
              | param
            )
            [ \t]+
          )?
          ([^\]]+)
          \]
          # regex-end
        captures:
          "1":
            name: string.other.link.comment.documentation.gdscript
          "2":
            name: markup.underline.link.comment.documentation.gdscript

  comment-documentation-codeblock:
    patterns:
      - name: "comment.block.documentation.gdscript comment.line.documentation.gdscript meta.comment.documentation.tag.codeblock.gdscript.gdscript"
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#]{2})
          [ \t]*
          (\[)
          (?:
            (codeblock)
            (?:
              [ \t]+
              ([lang]{0,4})
              (=)?
              ([a-z0-9]*)
            )?
          )
          (\])
          [ \t]*
          $
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.documentation.gdscript
          "2":
            name: punctuation.definition.tag.begin.gdscript
          "3":
            name: entity.name.tag.codeblock.gdscript
          "4":
            name: entity.other.attribute-name.gdscript
          "5":
            name: punctuation.separator.key-value.gdscript
          "6":
            name: string.unquoted.gdscript
          "7":
            name: punctuation.definition.tag.end.gdscript
        end: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#]{2})
          [ \t]*
          (\[)
            (/codeblock)
          (\])
          [ \t]*
          $
          # regex-end
        endCaptures:
          "1":
            name: punctuation.definition.comment.documentation.gdscript
          "2":
            name: punctuation.definition.tag.begin.gdscript
          "3":
            name: entity.name.tag.codeblock.gdscript
          "4":
            name: punctuation.definition.tag.end.gdscript
        patterns:
          - contentName: source.text
            begin: |-
              (?x)
              (?:^|\G)
              [ \t]*
              ([#]{2})
              # regex-end
            beginCaptures:
              "1":
                name: punctuation.definition.comment.documentation.gdscript
            end: |-
              (?x)
              $
              # regex-end

  comment-region-full-line:
    patterns:
      - name: comment.block.region.gdscript
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#])
          (region)
          (?:
            [ \t]+
            (.*)
          )?
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.number-sign.gdscript
          "2":
            name: keyword.declaration.region.gdscript
          "3":
            name: entity.name.section.gdscript
        end: |-
          (?x)
          $
          # regex-end
      - name: comment.block.region.gdscript
        begin: |-
          (?x)
          (?:^|\G)
          [ \t]*
          ([#])
          (endregion)
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.comment.number-sign.gdscript
          "2":
            name: keyword.declaration.region.gdscript
        end: |-
          (?x)
          $
          # regex-end

  signal-declaration:
    name: meta.signal.gdscript
    begin: |-
      (?x)
      [ \t]*
      \b(signal)[ \t]+
      (?=
        ([A-Za-z_][A-Za-z0-9_]*)
        [ \t]*
        \(
      )
      # regex-end
    beginCaptures:
      "1":
        name: "storage.type.function.gdscript storage.type.signal.gdscript"
    end: |-
      (?x)
      (?=[#'"\n])
      # regex-end
    patterns:
      - comment: "Signal name"
        patterns:
        # - include: "#_builtin-possible-callables"
          # - include: "#builtin-callables"
          - include: "#_builtin-functions"
          - include: "#builtin-type-primitive"
          - include: "#builtin-type-container"
          - include: "#builtin-type-vector"
          - include: "#builtin-type-variant"
          # - include: "#magic-names"
          - name: "entity.name.function.definition.gdscript entity.name.signal.definition.gdscript"
            match: |-
              (?x)
              \b([A-Za-z_][A-Za-z0-9_]*)\b
              # regex-end
      - name: "meta.function.parameters.gdscript meta.signal.parameters.gdscript"
        patterns:
          - include: "#_parameters"
      - include: "#line-continuation"

  function-and-lambda-declaration:
    name: meta.function.gdscript
    begin: |-
      (?x)
      [ \t]*
      \b(func)[ \t]+
      (?=
        ([A-Za-z_][A-Za-z0-9_]*)?
        [ \t]*
        \(
      )
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.function.gdscript
    end: |-
      (?x)
      (:|(?=[;#\n]))
      # regex-end
    endCaptures:
      "1":
        name: punctuation.section.function.begin.gdscript
    patterns:
      - comment: "Function name"
        patterns:
        # - include: "#_builtin-possible-callables"
          # - include: "#builtin-callables"
          - include: "#_builtin-functions"
          - include: "#builtin-type-primitive"
          - include: "#builtin-type-container"
          - include: "#builtin-type-vector"
          - include: "#builtin-type-variant"
          # - include: "#magic-names"
          - name: entity.name.function.definition.gdscript
            match: |-
              (?x)
              \b([A-Za-z_][A-Za-z0-9_]*)\b
              # regex-end
      - name: meta.function.parameters.gdscript
        patterns:
          - include: "#_parameters"
      - include: "#line-continuation"
      - comment: "Return type annotation"
        begin: |-
          (?x)
          (->)
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.separator.annotation.result.gdscript
        end: |-
          (?x)
          (?=[:;#\n])
          # regex-end
        patterns:
          - include: "#_type-annotation"

  _parameters:
    begin: |-
      (?x)
      (\()
      # regex-end
    beginCaptures:
      "1":
        name: punctuation.definition.parameters.begin.gdscript
    end: |-
      (?x)
      (\))
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.parameters.end.gdscript
    patterns:
      - name: keyword.operator.unpacking.parameter.gdscript
        match: |-
          (?x)
          (\.\.\.)
          # regex-end
      - include: "#function-and-lambda-declaration"
      - comment: "'self' parameter"
        match: |-
          (?x)
          \b(self)\b
          [ \t]*
          (?:
            (,)
            | (?=[)#\n=])
          )
          # regex-end
        captures:
          "1":
            name: variable.parameter.function.language.special.self.gdscript
          "2":
            name: punctuation.separator.parameters.gdscript
      - match: |-
          (?x)
          ([A-Za-z_][A-Za-z0-9_]*)
          [ \t]*
          (?:
            (,)
            | (?=[)#\n=])
          )
          # regex-end
        captures:
          "1":
            name: variable.parameter.function.language.gdscript
          "2":
            name: punctuation.separator.parameters.gdscript
      - include: "#comment-documentation"
      - include: "#comment"
      - comment: "Default value"
        begin: |-
          (?x)
          (?:
            (:=)
            | (?<!=)(=)(?!=)
          )
          # regex-end
        beginCaptures:
          "1":
            name: keyword.operator.assignment.infer.gdscript
          "2":
            name: keyword.operator.assignment.equal.gdscript
        end: |-
          (?x)
          (?:
            (,)
            | (?=[)#\n=])
          )
          # regex-end
        endCaptures:
          "1":
            name: punctuation.separator.parameters.gdscript
        patterns:
          - include: "#expression"
      - comment: "Type annotated parameter"
        begin: |-
          (?x)
          \b
          ([A-Za-z_][A-Za-z0-9_]*)
          [ \t]*
          (:)
          # regex-end
        beginCaptures:
          "1":
            name: variable.parameter.function.language.gdscript
          "2":
            name: punctuation.separator.annotation.gdscript
        end: |-
          (?x)
          (?:
            (,)
            | (?=[)#\n=])
          )
          # regex-end
        endCaptures:
          "1":
            name: punctuation.separator.parameters.gdscript
        patterns:
          - include: "#_type-annotation"
          - match: |-
              (?x)
              (?<!=)(=)(?!=)
              # regex-end
            captures:
              "1":
                name: keyword.operator.assignment.equal.gdscript
          - include: "#expression"

  _type-annotation:
    name: meta.type.annotation.gdscript
    patterns:
      - include: "#builtin-type-primitive"
      - include: "#builtin-type-container"
      - include: "#builtin-type-vector"
      - include: "#builtin-type-variant"
      - comment: "Generic type parameter"
        contentName: meta.item-access.arguments.gdscript
        begin: |-
          (?x)
          (\[)
          # regex-end
        beginCaptures:
          "1":
            name: punctuation.definition.arguments.begin.gdscript
        end: |-
          (?x)
          (?=\])
          # regex-end
        patterns:
          - include: "#expression"

  _builtin-functions:
    name: support.function.builtin.gdscript
    match: |-
      (?x)
      \b(?:
        # @GlobalScope
        abs
        | absf
        | absi
        | acos
        | acosh
        | angle_difference
        | asin
        | asinh
        | atan
        | atan2
        | atanh
        | bezier_derivative
        | bezier_interpolate
        | bytes_to_var
        | bytes_to_var_with_objects
        | ceil
        | ceilf
        | ceili
        | clamp
        | clampf
        | clampi
        | cos
        | cosh
        | cubic_interpolates
        | cubic_interpolate_angle
        | cubic_interpolate_angle_in_time
        | cubic_interpolate_in_time
        | db_to_linear
        | deg_to_rad
        | ease
        | error_string
        | exp
        | floor
        | floorf
        | floori
        | fmod
        | fposmod
        | hash
        | instance_from_id
        | inverse_lerp
        | is_equal_approx
        | is_finite
        | is_inf
        | is_instance_id_valid
        | is_instance_valid
        | is_nan
        | is_same
        | is_zero_approx
        | lerp
        | lerp_angle
        | lerpf
        | linear_to_db
        | log
        | max
        | maxf
        | maxi
        | min
        | minf
        | mini
        | move_toward
        | nearest_po2
        | pingpong
        | posmod
        | pow
        | print
        | print_rich
        | print_verbose
        | printerr
        | printraw
        | prints
        | printt
        | push_error
        | push_warning
        | rad_to_deg
        | rand_from_seed
        | randf
        | randf_range
        | randfn
        | randi
        | randi_range
        | randomize
        | remap
        | rid_allocate_id
        | rid_from_int64
        | rotate_toward
        | round
        | roundf
        | roundi
        | seed
        | sign
        | signf
        | signi
        | sin
        | sinh
        | smoothstep
        | snapped
        | snappedf
        | snappedi
        | sqrt
        | step_decimals
        | str
        | str_to_var
        | tan
        | tanh
        | type_convert
        | type_string
        | typeof
        | var_to_bytes
        | var_to_bytes_with_objects
        | var_to_str
        | weakref
        | wrap
        | wrapf
        | wrapi
        # @GDScript
        | Color8
        | assert
        | char
        | convert
        | dict_to_inst
        | get_stack
        | inst_to_dict
        | is_instance_of
        | len
        | load
        | ord
        | preload
        | print_debug
        | print_stack
        | range
        | type_exists
      )\b
      # regex-end

  class-name-declaration:
    name: meta.class.declaration.gdscript
    match: |-
      (?x)
      (?:^|\G)
      [ \t]*
      (class_name)
      [ \t]+
      ([A-Za-z_][A-Za-z0-9_]*)
      # regex-end
    captures:
      "1":
        name: storage.type.class.gdscript
      "2":
        name: entity.name.type.class.gdscript

  class-declaration:
    name: meta.class.declaration.gdscript
    contentName: entity.other.inherited-class.gdscript
    begin: |-
      (?x)
      (?:^|\G)
      [ \t]*
      (class)
      [ \t]+
      ([A-Za-z_][A-Za-z0-9_]*)
      (?:
        [ \t]+
        (extends)
        [ \t]+
      )?
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.class.gdscript
      "2":
        name: entity.name.type.class.gdscript
      "3":
        name: keyword.control.inheritance.gdscript
    end: |-
      (?x)
      (:)
      # regex-end
    endCaptures:
      "1":
        name: punctuation.section.class.begin.gdscript
    patterns:
      - include: "#_string-quoted-multi-line"
      - include: "#_string-quoted-single-line"
      - include: "#_string-raw-quoted-multi-line"
      - include: "#_string-raw-quoted-single-line"
      - match: |-
          (?x)
          (\.)?
          ([A-Za-z_][A-Za-z0-9_]*)
          # regex-end

  extends-declaration:
    name: meta.class.declaration.gdscript
    contentName: entity.other.inherited-class.gdscript
    begin: |-
      (?x)
      [ \t]*
      (extends)
      [ \t]+
      # regex-end
    beginCaptures:
      "1":
        name: keyword.control.inheritance.gdscript
    end: |-
      (?x)
      $
      # regex-end
    patterns:
      - include: "#_string-quoted-multi-line"
      - include: "#_string-quoted-single-line"
      - include: "#_string-raw-quoted-multi-line"
      - include: "#_string-raw-quoted-single-line"
      - match: |-
          (?x)
          (\.)?
          ([A-Za-z_][A-Za-z0-9_]*)
          # regex-end

  enum-declaration:
    name: meta.enum.declaration.gdscript
    begin: |-
      (?x)
      (?:^|\G)
      [ \t]*
      (enum)
      (?:
        [ \t]+
        ([A-Za-z_][A-Za-z0-9_]*)
      )?
      [ \t]*
      (\{)
      # regex-end
    beginCaptures:
      "1":
        name: storage.type.enum.gdscript
      "2":
        name: entity.name.type.enum.gdscript
      "3":
        name: punctuation.definition.block.begin.gdscript
    end: |-
      (?x)
      (\})
      # regex-end
    endCaptures:
      "1":
        name: punctuation.definition.block.end.gdscript
    patterns:
      - match: |-
          (?x)
          [ \t]*
          ([A-Za-z_][A-Za-z0-9_]*)
          [ \t]*
          (?:
            (=)
            [ \t]*
            ([+-]?)
            [ \t]*
            ([0-9]*)
          )?
          (,)?
          # regex-end
        captures:
          "1":
            name: variable.other.enummember.gdscript
          "2":
            name: punctuation.separator.key-value.enum.gdscript
          "3":
            name: keyword.operator.arithmetic.gdscript
          "4":
            name: constant.numeric.dec.gdscript
          "5":
            name: punctuation.separator.comma.gdscript

  const-declaration:
    name: meta.const.declaration.gdscript
    match: |-
      (?x)
      (?:^|\G)
      [ \t]*
      (const)
      [ \t]+
      ([A-Za-z_][A-Za-z0-9_]*)
      [ \t]*
      (?:
        (:=)
        | (:)
        | (=)
      )
      # regex-end
    captures:
      "1":
        name: storage.type.const.gdscript
      "2":
        name: variable.other.constant.gdscript
      "3":
        name: keyword.operator.assignment.infer.gdscript
      "4":
        name: keyword.operator.type.annotation.gdscript
      "5":
        name: keyword.operator.assignment.equal.gdscript

  var-declaration:
    name: meta.const.declaration.gdscript
    match: |-
      (?x)
      (?:^|\G)
      [ \t]*
      (?:
        (static)
        [ \t]+
      )?
      (var)
      [ \t]+
      ([A-Za-z_][A-Za-z0-9_]*)
      [ \t]*
      (?:
        (:=)
        | (:)
        | (=)
      )
      # regex-end
    captures:
      "1":
        name: storage.modifier.static.gdscript
      "2":
        name: storage.type.const.gdscript
      "3":
        name: variable.other.readwrite.gdscript
      "4":
        name: keyword.operator.assignment.infer.gdscript
      "5":
        name: keyword.operator.type.annotation.gdscript
      "6":
        name: keyword.operator.assignment.equal.gdscript

  annotation:
    patterns:
      - comment: "Without arguments"
