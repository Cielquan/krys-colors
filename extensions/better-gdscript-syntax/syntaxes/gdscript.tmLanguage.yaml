      - include: "#builtin-type-variant"
      - include: "#builtin-enums"
      - include: "#builtin-classes"
      - comment: "User-defined types"
        patterns:
          - comment: "Probably class (or enum)"
            match: |-
              (?x)
              (_?[A-Z][A-Za-z0-9_]*)
