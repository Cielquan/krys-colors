  builtin-type-primitive:
    match: |-
      (?x)
      \b(?:
        (int)
        | (float)
        | (bool)
        | (String)
        | (StringName)
        | (NodePath)
        | (void)
      )\b
      (?![ \t]*\()
      # regex-end
    captures:
      "1":
        name: support.type.primitive.int.gdscript
      "2":
        name: support.type.primitive.float.gdscript
      "3":
        name: support.type.primitive.bool.gdscript
      "4":
        name: support.type.primitive.string.gdscript
      "5":
        name: support.type.primitive.string-name.gdscript
      "6":
        name: support.type.primitive.node-path.gdscript
      "7":
        name: support.type.primitive.void.gdscript

  builtin-type-container:
    match: |-
      (?x)
      \b(?:
        (Array)
        | (Callable)
        | (Dictionary)
        | (Packed(?:
            Byte
            | Color
            | Float(?:32|64)
            | Int(?:32|64)
            | String
            | Vector[2-4]
          )Array)
        | (Signal)
      )\b
      (?![ \t]*\()
      # regex-end
    captures:
      "1":
        name: support.type.container.array.gdscript
      "2":
        name: support.type.container.callable.gdscript
      "3":
        name: support.type.container.dictionary.gdscript
      "4":
        name: support.type.container.array.packed.gdscript
      "5":
        name: support.type.container.signal.gdscript

