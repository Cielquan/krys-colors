<!DOCTYPE html>

<?xml-stylesheet href="theme.css" type="text/css"?>

<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Syntax &amp; Highlighting</title>

    <style>
      :root { --color: #639; }
      body { color: var(--color); }
    </style>

    <script type="module">
      const msg = `Hello, ${location.hostname}!`;
      console.log(msg);
    </script>
  </head>

  <body id="app" class="page" hidden data-value="42">
    <p>
      <a href="https://example.com" target="_blank">Link</a>
      &copy; &#169; &#xA9;
    </p>

    <input type="checkbox" checked disabled>

    <template id="tpl">
      <span class="item">Template</span>
    </template>

    <svg viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="6" fill="currentColor"/>
    </svg>

    <pre>&lt;escaped&gt;</pre>

    <textarea>Plain text & markup.</textarea>

    <!--[if IE]>Legacy<![endif]-->
  </body>
</html>
